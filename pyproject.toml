[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "slurm_gen"
version = "0.1.1"
description = "SLURM job generation and management library"
readme = "README.md"
authors = [
  { name = "OpenEuroLLM" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["slurm", "hpc", "job-scheduling", "batch-processing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "compoconf>=0.1.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
]

[project.urls]
Homepage = "https://github.com/OpenEuroLLM/oellm-autoexp"
Repository = "https://github.com/OpenEuroLLM/oellm-autoexp"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/slurm_gen"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["E203"]

[tool.docformatter]
wrap-summaries = 88
wrap-descriptions = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=slurm_gen --cov-report=term-missing -q"
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
